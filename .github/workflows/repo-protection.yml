name: Repo Protection

on:
  pull_request:
  push:
    branches:
      - production
      - branch-3
      - codex/online-performance-clean

jobs:
  protect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for unresolved merge markers
        run: node scripts/precommit-check.js --all

      - name: Run no-backdating test
        run: npm test -- --runInBand tests/unit/noBackdating.test.ts

      - name: Build application
        run: npm run build
