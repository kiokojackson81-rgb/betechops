name: "Primary: Migrate and Deploy to Vercel"

on:
  # The storefront and Ops domains must be deployed from the branch that
  # contains the shared WebsiteOrder flow. Keeping this limited to branch-3
  # left the live checkout behind the Website Orders API and admin queue.
  push:
    branches: ["branch-3", "pos-catalogue-only-production-safe"]
  workflow_dispatch: {}

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        # The checked-in lockfile intentionally retains Nodemailer 6 for the
        # existing mail integration while NextAuth declares Nodemailer 7 as
        # an optional peer. Install from the lockfile without re-resolving
        # that optional peer so migrations and the production build run.
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not configured in repository secrets." >&2
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "DIRECT_URL is not configured; falling back to DATABASE_URL for prisma migrate deploy." >&2
            export DIRECT_URL="$DATABASE_URL"
          fi
          npx prisma migrate deploy

      - name: Install Vercel CLI
        run: npm install -g vercel@35

      - name: Vercel deploy (production preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          vercel env pull .vercel.env --yes || true
          vercel deploy --prebuilt --token $VERCEL_TOKEN --confirm --prod
