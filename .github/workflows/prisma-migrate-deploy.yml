name: Prisma Migrate Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  migrate:
    name: Run Prisma Migrate Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Migrate Deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
name: Prisma Migrate Deploy

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run migrations (true/false)'
        required: false
        default: 'true'
  push:
    branches:
      - main
      - feature/daily-report-redesign

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@8.6.0 --activate
          pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        if: ${{ github.event.inputs.run_migrations == 'true' || github.event_name != 'workflow_dispatch' }}
        run: |
          echo "Starting prisma migrate deploy"
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Show `User.attendantCategory` counts (read-only)
        run: |
          echo "SELECT coalesce(attendantCategory::text, 'NULL') AS category, COUNT(*) FROM \"User\" GROUP BY attendantCategory ORDER BY category;" > query.sql
          # run as a convenience read-only check; failure here should not block the workflow
          npx prisma db execute --schema=prisma/schema.prisma --stdin < query.sql || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

