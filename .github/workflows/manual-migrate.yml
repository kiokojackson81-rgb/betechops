name: Manual Prisma Migrate Deploy

on:
  workflow_dispatch: {}

jobs:
  migrate:
    name: Deploy migrations to production (manual)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Migrate Deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Running prisma migrate deploy against production database"
          pnpm prisma migrate deploy

      - name: Show migrate status
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npx prisma migrate status

      - name: Confirmation
        run: echo "Migration workflow finished. Verify application and run smoke tests."